# The port data of the HK MP7.
#   python3 tools/port.py port.toml          run the port
#   python3 tools/port.py port.toml show     print each value that the tools assume
# A 3ds Max source has free scene names, so this file names each part and each clip.
name = "MP7"
template = "smg"

# The source is a set of 3ds Max scenes. `meshes` is the scene that gives the gun meshes,
# and `rest` is the scene whose first frame gives the place of each gun node.
[source]
kind = "max"
meshes = "reload_48"
rest = "fp_base_idle_4_5"

[weapon]
# FNV weapon bone space: +X to the muzzle, +Y up, +Z to the right.
trigger = [2.24, 2.15, -0.04]         # center of the mesh ##Trigger:0
casing = [-2.44, 4.0, 1.7]            # the ejection port (ShellCasingNode of the scene, 0.7 higher)
muzzle_mesh = "Muzzle:0"

# Fallout 4 weapon bone = node of the source that it follows.
[parts]
WeaponBolt = "##nmBar"
WeaponMagazine = "##nmClip"
WeaponMagazineChild1 = "##nmBullet"
WeaponTrigger = "##Trigger"
WeaponExtra1 = "##MP7ChargingHandel"
WeaponExtra2 = "##nmClip2"

[mesh]
static = ["Receiver:0", "Stock:0", "Grip:0", "IronSights:0", "Muzzle:0", "FireSelector:0", "BoltCatch:0", "MagRelease:0"]

# Mesh of the source = Fallout 4 weapon bone that carries it.
[mesh.bones]
"##nmBar:0" = "WeaponBolt"
"##MP7ChargingHandel:0" = "WeaponExtra1"
"##nmClip:0" = "WeaponMagazine"
"##nmClip:2" = "WeaponMagazineChild1"
"##Trigger:0" = "WeaponTrigger"
"##nmClip2:0" = "WeaponExtra2"
"##nmClip2:2" = "WeaponExtra2"

[glb]
material = "MP7"

# The MP7 was made before the two finger rules (the least bend of a joint, and the skin of a
# finger at the skin of the source finger). The rules stay off, so the clips are those of the
# tested release.
[fingers]
min_bend = 0.0
skin_center = false

[materials]
MP7 = "Materials/Weapons/MP7/MP7.bgsm"

# Shapes of the parts file that are not colliders for the fingers: each cartridge is inside its magazine.
[collision]
skip = ["nmClip_2", "nmClip2_2"]

# The contact check (tools/blender/hand_contact.py). The second magazine is at the place of the
# first one, so it is a collider only after the other parts.
[validate]
skip_parts = ["nmClip2_2", "nmClip_2"]
late_parts = ["nmClip2_0"]
skip_source = ["##nmClip2:2", "##nmClip:2"]

# The movement clips: the weapon motion of the vanilla clip on a pose of the MP7.
[synth]
ready = { bake = "fp_base_idle_4_5" }
sighted = { bake = "ads_idle" }
moving = ["MP7", "MP7 Parts"]

[synth.clips]
WPNWalkForwardReady = "ready"
WPNRunForwardReady = "ready"
WPNRunLeftReady = "ready"
WPNRunRightReady = "ready"
WPNRunGunDown = "ready"
WPNSprint = "ready"
WPNJumpImpactLand = "ready"
WPNWalkForwardSighted = "sighted"

[synth.static]
WPNIdleGunDown = { base = "ready", vanilla = "wpnrungundown", frame = 0 }

# The clips. An event is a frame (30 for each second) and a text.
[clips.WPNIdleReady]
source = "fp_base_idle_4_5"
[clips.WPNIdleSighted]
source = "ads_idle"
# No WPNIdleSightedWobble: the vanilla clip is an additive clip (blend hint 2). The graph adds
# it to the pose when an arm is crippled. A full pose with this name would pull the gun to the
# sighted pose.
[clips.WPNFireSingleReady]
source = "fire_1_4"
events = [[0, "weaponFire"]]
[clips.WPNFireSingleReadyA]
source = "fire_2_3"
events = [[0, "weaponFire"]]
[clips.WPNFireSingleReadyB]
source = "fire_3_3"
events = [[0, "weaponFire"]]
[clips.WPNFireSingleSighted]
source = "ads_fire_1_5"
events = [[0, "weaponFire"]]
[clips.WPNFireAutoReadyForward]
auto = ["fire_1_4", "fire_2_3", "fire_3_3"]
[clips.WPNFireAutoReadyBack]
auto = ["fire_2_3", "fire_3_3", "fire_1_4"]
[clips.WPNFireAutoSighted]
auto = ["ads_fire_1_5", "ads_fire_2_1", "ads_fire_3"]
[clips.WPNEquip]
source = "draw_5"
events = [[0, "SoundPlay.{sound}EquipUp"]]
[clips.WPNEquipFast]
source = "draw_5"
events = [[0, "SoundPlay.{sound}EquipUpFast"]]
[clips.WPNUnEquip]
source = "holster_3"
# Tactical reload: the magazine leaves at frame 14 and the new one is in at frame 66.
[clips.WPNReload]
source = "reloadtac_42"
events = [[14, "SoundPlay.{sound}ReloadMagOut"], [66, "SoundPlay.{sound}ReloadMagIn"], [68, "reloadComplete"], [94, "initiateStart"], [95, "reloadEnd"]]
# Empty reload: magazine out at frame 21, in at frame 73, charging handle from frame 96 to frame 104.
[clips.WPNReloadEmpty]
source = "reload_48"
events = [[21, "SoundPlay.{sound}ReloadMagOut"], [72, "SoundPlay.{sound}ReloadMagIn"], [74, "reloadComplete"], [96, "SoundPlay.{sound}ReloadBoltOpen"], [103, "SoundPlay.{sound}ReloadBoltClose"], [118, "initiateStart"], [119, "reloadEnd"]]

# Idle variants. The graph plays one of them at random while the player stands, and one
# directly after the draw, so each variant is the plain idle.
[clips.WPNIdleReadyA]
source = "fp_base_idle_4_5"
[clips.WPNIdleReadyB]
source = "fp_base_idle_4_5"
[clips.WPNIdleReadyC]
source = "fp_base_idle_4_5"
[clips.WPNIdleReadyD]
source = "fp_base_idle_4_5"

[clips.WPNWalkForwardReady]
synth = true
[clips.WPNWalkForwardSighted]
synth = true
[clips.WPNRunForwardReady]
synth = true
[clips.WPNRunLeftReady]
synth = true
[clips.WPNRunRightReady]
synth = true
[clips.WPNRunGunDown]
synth = true
[clips.WPNSprint]
synth = true
[clips.WPNJumpImpactLand]
synth = true
[clips.WPNIdleGunDown]
synth = true
