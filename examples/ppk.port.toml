# The port data of the Walther PPK.
#   python3 tools/port.py port.toml          run the port
#   python3 tools/port.py port.toml show     print each value that the tools assume
#
# The folder `source` has the extracted mod. The tools find the model, the animations, the
# gun parts, the clips and their events there. This file gives only what they cannot find.
name = "PPK"
template = "pistol10mm"

# The mod has no texture file: the models use the textures of the base mod. Put the folder
# `textures` of the base mod into `source`, and the tools convert it. Without it each material
# has one of these colors.
[textures.stand_in]
default = [58, 58, 62]
blackgrip = [30, 30, 32]
bullet = [150, 110, 50]

# New Vegas has a complete model for each set of weapon mods. This table takes the suppressor
# from one of them.
[[attachment]]
name = "Suppressor"
model = "meshes/tigerx87/weapons/ppk/ppk sil.nif"
shapes = ["ppk_sil_lo"]
connect = "Muzzle"
